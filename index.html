<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Julian Jung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Landing: two words, one screen. Pointing at a portfolio turns the whole page
   its colour: paper for research, ink for products and design. */
:root{
  --paper:#f5f5f3;
  --ink:#0b0b0c;
  --bg:var(--paper);
  --fg:var(--ink);
  --pad:clamp(20px,3.4vw,44px);
  --gl:max(var(--pad),env(safe-area-inset-left,0px));
  --gr:max(var(--pad),env(safe-area-inset-right,0px));
  --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
  --grot:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.65,0,.35,1);
  color-scheme:light;
}
:root.dark{--bg:var(--ink);--fg:var(--paper);color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--grot);-webkit-font-smoothing:antialiased;
  transition:background-color 1s var(--ease),color 1s var(--ease)}
::selection{background:var(--fg);color:var(--bg)}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:16px;
  padding:calc(var(--pad) + env(safe-area-inset-top,0px)) var(--gr) 0 var(--gl);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase}
.top b{font-family:var(--grot);font-size:14px;letter-spacing:-.01em;text-transform:none;font-weight:700}
.top span{opacity:.5}
.pick{min-height:100svh;display:flex;align-items:center;justify-content:center;gap:clamp(48px,9vw,160px);
  padding-block:calc(var(--pad) * 3);padding-left:var(--gl);padding-right:var(--gr)}
.opt{display:flex;flex-direction:column;gap:18px;color:inherit;text-decoration:none;transition:opacity .7s var(--ease)}
.w{font-weight:700;font-size:clamp(64px,11vw,190px);letter-spacing:-.06em;line-height:.85}
.c{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;display:flex;gap:10px;opacity:.55;
  transition:gap .5s var(--ease),opacity .5s var(--ease)}
.opt:hover .c,.opt:focus-visible .c{gap:16px;opacity:1}
.c i{font-style:normal}
@media(hover:hover){.pick:hover .opt{opacity:.22}.pick .opt:hover{opacity:1}}
.opt:focus-visible{outline:1.5px solid currentColor;outline-offset:14px}
@media(max-width:700px){.pick{flex-direction:column;align-items:flex-start;justify-content:center;gap:56px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>

<header class="top"><b>Julian Jung</b><span>UC Berkeley · 2026</span></header>
<nav class="pick" aria-label="Choose a portfolio">
  <a class="opt" data-tone="light" href="research/index.html">
    <span class="w">Tested.</span>
    <span class="c">01 — Research &amp; engineering <i>→</i></span>
  </a>
  <a class="opt" data-tone="dark" href="works/index.html">
    <span class="w">Made.</span>
    <span class="c">02 — Products &amp; design <i>→</i></span>
  </a>
</nav>

<script>
/* the page takes the colour of whichever portfolio you point at, and keeps it until you point at the other */
document.querySelectorAll('.opt').forEach(function(a){
  function tone(){document.documentElement.classList.toggle('dark',a.dataset.tone==='dark');}
  a.addEventListener('mouseenter',tone);a.addEventListener('focus',tone);a.addEventListener('touchstart',tone,{passive:true});
});
</script>
