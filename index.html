<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Julian Jung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Landing: only the choice. Pointing at a portfolio turns the whole page its colour:
   paper for engineering, ink for design. The hairline grid fades with it. */
:root{
  --paper:#f5f5f3;
  --ink:#0b0b0c;
  --bg:var(--paper);
  --fg:var(--ink);
  --pad:clamp(20px,3.4vw,44px);
  --gl:max(var(--pad),env(safe-area-inset-left,0px));
  --gr:max(var(--pad),env(safe-area-inset-right,0px));
  --grot:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.65,0,.35,1);
  color-scheme:light;
}
:root.dark{--bg:var(--ink);--fg:var(--paper);color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--grot);-webkit-font-smoothing:antialiased;
  transition:background-color 1s var(--ease),color 1s var(--ease)}
/* drawn in currentColor, so the grid fades with the text instead of jumping */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;
  background-image:linear-gradient(to right,currentColor 0 1px,transparent 1px);background-size:calc(100% / 9) 100%}
::selection{background:var(--fg);color:var(--bg)}
.pick{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;gap:clamp(48px,9vw,160px);
  padding-block:var(--pad);padding-left:var(--gl);padding-right:var(--gr)}
.opt{color:inherit;text-decoration:none;font-weight:700;font-size:clamp(48px,7.4vw,150px);letter-spacing:-.06em;line-height:.85;
  transition:opacity .7s var(--ease)}
@media(hover:hover){.pick:hover .opt{opacity:.22}.pick .opt:hover{opacity:1}}
.opt:focus-visible{outline:1.5px solid currentColor;outline-offset:14px}
@media(max-width:700px){.pick{flex-direction:column;align-items:flex-start;gap:48px}.opt{font-size:15vw}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>

<nav class="pick" aria-label="Choose a portfolio">
  <a class="opt" data-tone="light" href="research/index.html" aria-label="Engineered: research and engineering portfolio">Engineered.</a>
  <a class="opt" data-tone="dark" href="works/index.html" aria-label="Designed: products and design portfolio">Designed.</a>
</nav>

<script>
/* the page takes the colour of whichever portfolio you point at, and keeps it until you point at the other */
document.querySelectorAll('.opt').forEach(function(a){
  function tone(){document.documentElement.classList.toggle('dark',a.dataset.tone==='dark');}
  a.addEventListener('mouseenter',tone);a.addEventListener('focus',tone);a.addEventListener('touchstart',tone,{passive:true});
});
</script>
